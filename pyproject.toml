[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parthetten-rerunstable"
version = "0.1.0"
description = "对同一配置多次运行，统计分数分布与波动幅度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "parthetten" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://parthetten.github.io"
Repository = "https://github.com/parthetten/rerunstable"
Issues = "https://github.com/parthetten/rerunstable/issues"

[project.scripts]
rerunstable = "rerunstable:main"

[tool.setuptools]
py-modules = ["rerunstable"]
